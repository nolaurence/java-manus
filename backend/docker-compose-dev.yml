services:
  backend:
    build:
      context: ./
      dockerfile: Dockerfile_backend
    image: backend
    hostname: sandbox
#    command: ["./dev.sh"]  # Start in reload mode
    volumes:
      - ./:/app  # Mount source code directory
      - ./skills-data:/app/skills  # Skill文件共享存储
      - /etc/timezone:/etc/timezone  # sync time zone
#      - /var/run/docker.sock:/var/run/docker.sock:ro
#      - /app/__pycache__  # Avoid overwriting cache files
#      - /app/.venv  # Avoid overwriting virtual environment
    ports:
      - "7001:7001"
      - "5005:5005"
#    depends_on:
#      sandbox:
#        condition: service_started
#        required: false
#    restart: unless-stopped
    networks:
      - manus-network
#    env_file:
#      - .env
    environment:
      - SANDBOX_ADDRESS=sandbox # Use single container as sandbox
      - SKILL_STORAGE_PATH=/app/skills

  worker:
    build:
      context: ./
      dockerfile: Dockerfile_worker
    image: worker
    hostname: sandbox
    volumes:
      - ./:/app  # Mount source code directory
      - ./skills-data:/app/skills  # Skill文件共享存储（与backend共享）
      - /etc/timezone:/etc/timezone  # sync time zone
#      - ./supervisord.conf:/etc/supervisor/conf.d/app.conf
#      - /app/__pycache__  # Avoid overwriting cache files
#      - /app/.venv  # Avoid overwriting virtual environment
    ports:
      #- "9222:9222"
      - "5902:5902"
      - "5900:5900"
      - "7002:7002"
      - "7500:7500"
      - "5006:5005"
      - "8222:8222"
    environment:
      - UVI_ARGS="--reload"
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - SKILL_SCRIPTS_PATH=/app/skills/extracted
#    restart: unless-stopped
    networks:
      - manus-network

networks:
  manus-network:
    name: manus-network
    driver: bridge

volumes:
  skills-data:
    driver: local
